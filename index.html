<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main>
        <section>
            <div id="employees-container">
                <button id="display">Display</button>
                <button id="hide">Hide</button>
                <table id="employees-table" border="1">
                    <thead>
                        <tr>
                            <th>Nom</th>
                            <th>Prénom</th>
                            <th>Département</th>
                            <th>Poste</th>
                            <th>Salaire</th>
                            <th>skills</th>
                            <th>joinDate</th>
                            <th>isActive</th>
                            <th>languages</th>
                        </tr>
                    </thead>
                    <tbody id="employees-tbody">
                    </tbody>
                </table>
            </div>
            <form id="employee-form">
                <div id="form-fields">
                    <input type="text" id="firstName" name="firstName" placeholder="Prénom" required>
                    <input type="text" id="lastName" name="lastName" placeholder="Nom" required>
                    <input type="number" name="age" id="age" placeholder="Âge" min="18" max="65">
                    <select name="department" id="department">
                        <option value="">Choisir un département</option>
                        <option value="Développement">Développement</option>
                        <option value="Design">Design</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Management">Management</option>
                    </select>
                </div>
                <button type="button" id="add-skill-btn">+ Compétence</button>
                <div id="skills-container"></div>
                <button type="submit" id="addEmployee">Ajouter l'employé</button>
            </form>
        </section>
    </main>
    <script type="module" src="script.js"></script>
</body>

</html>
